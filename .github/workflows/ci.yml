name: Rust CI

# Linux (Ubuntu) is the only supported OS. Jobs run in parallel; the slowest
# test shard is the critical path, so shards are balanced by runtime
# (see .github/scripts/test-shard.sh).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Debug info only slows compile/link and bloats the cache; incremental
  # compilation cannot help a fresh runner.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 5

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.8.1
        with:
          workspaces: src -> target
          shared-key: clippy
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Measured runtimes: reload ~185s (incl. release prebuild), cluster ~96s,
        # daemon ~84s, rest ~125s.
        shard: [reload, cluster, daemon, rest]
    steps:
      - uses: actions/checkout@v4
      # trybuild compares rustc diagnostics with checked-in snapshots.
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2.8.1
        with:
          workspaces: src -> target
          shared-key: test
          save-if: ${{ matrix.shard == 'rest' }}
      # Some integration tests launch Cargo offline, including on a cold runner.
      - name: Fetch locked dependencies
        working-directory: src
        run: cargo fetch --locked
      - name: Test shard
        run: .github/scripts/test-shard.sh ${{ matrix.shard }}
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.shard }}
          path: src/test-output.log
          if-no-files-found: ignore

  examples-doctor:
    name: examples and doctor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2.8.1
        with:
          workspaces: src -> target
          shared-key: examples
      - run: cargo build --locked --workspace --examples
      - run: cargo run --locked --bin doctor -- examples/placement.toml --resolved-shards bot-two=1

  # Single required status check for branch protection.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [fmt, clippy, test, examples-doctor]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          if [ '${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}' = 'true' ]; then exit 1; fi
