name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build examples
        run: cargo build --workspace --examples
      # Prebuild dependencies outside the integration test's 240 second timeout.
      - name: Prepare reload build
        run: cargo build --release --bin src --target-dir target/reload-build
      # The reload integration test builds a release binary and launches real
      # local worker processes. It does not require a Discord token.
      - name: Test
        run: cargo test --workspace
