[package]
name = "src"
version = "0.1.0"
edition = "2024"

[dependencies]
bot-framework = { path = "framework" }
rustls = { version = "0.23.46", features = ["ring"] }
tokio = { version = "1.54.1", features = ["full"] }
twilight-gateway = "0.18"
twilight-gateway-queue = "0.18"
twilight-http = "0.18"
twilight-model = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
getrandom = "0.4"
libc = "0.2"
subtle = "2"
tokio-rustls = "0.26"
openraft = { version = "=0.9.26", features = ["serde", "storage-v2", "generic-snapshot-data"] }

[workspace]
members = ["framework", "framework-macros"]
exclude = ["vendor/twilight-gateway"]
resolver = "3"

[patch.crates-io]
twilight-gateway = { path = "vendor/twilight-gateway" }

[dev-dependencies]
futures-util = { version = "0.3", features = ["sink"] }
rcgen = "0.13"
rmp-serde = "1"
tracing = "0.1"
tokio-websockets = { version = "0.13", default-features = false, features = ["server", "sha1_smol"] }

[[test]]
name = "identify_send_grants"
path = "tests/identify_send_grants.rs"
harness = false

[[bin]]
name = "botctl"
path = "src/bin/botctl.rs"

[[bin]]
name = "botd"
path = "src/bin/botd.rs"

[[bench]]
name = "ipc_codec"
harness = false

[[bench]]
name = "ipc_roundtrip"
harness = false

[[bench]]
name = "primitives"
harness = false

[[bench]]
name = "failover_detect"
harness = false

# Faster dev/test builds: keep line tables for backtraces, drop full debug info
# (dependencies get none). Does not change runtime behaviour.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
